<main class="page">
  <div class="page__container">
    <h1 class="page__title">Generador de matrices de caracol</h1>
    <div class="page__content">
      <div class="page__card">
        <app-matrix-form (matrixSizeSubmit)="onMatrixSizeSubmit($event)" />
      </div>
      @if (matrixSize() !== null) {
        <div class="page__result">
          <app-matrix-result [size]="matrixSize()!" />
        </div>
      }
    </div>
  </div>
</main>
